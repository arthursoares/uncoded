name: Uncoded
options:
  bundleIdPrefix: com.arthursoares
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Uncoded:
    type: application
    platform: macOS
    sources:
      - path: Uncoded/Sources
      - path: Uncoded/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthursoares.Uncoded
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Arthur Soares"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - UncodedTests
      # Xcode gives a hosted test bundle a scrubbed environment, so the real-file
      # tests can only see UNCODED_TEST_DNG if the scheme forwards it. The value
      # is a build setting, which xcodebuild takes on the command line:
      #   xcodebuild … test UNCODED_TEST_DNG=/path/to/copy.dng
      environmentVariables:
        - variable: UNCODED_TEST_DNG
          value: $(UNCODED_TEST_DNG)
          isEnabled: true
  UncodedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UncodedTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Uncoded

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild -scheme Uncoded -configuration Release \
            -derivedDataPath DerivedData build 2>&1 | tail -30
      - name: Package DMG
        run: bash scripts/make_dmg.sh DerivedData/Build/Products/Release/Uncoded.app dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            Requires macOS 14+. The lens-profile picker needs Adobe Lightroom / Camera Raw installed.

            ### Running the unsigned app

            Uncoded isn't code-signed or notarized yet, so macOS will warn that it can't verify the app. It's built by GitHub Actions directly from this repository's tagged source — inspect the exact build in the Actions tab.

            **macOS 15 (Sequoia) and later:**
            1. Open the DMG and drag **Uncoded** into **Applications**.
            2. Double-click Uncoded. macOS says it *"was not opened because it could not verify…"* — click **Done** (not *Move to Trash*).
            3. Open **System Settings → Privacy & Security**, scroll down to *"Uncoded" was blocked…* and click **Open Anyway**, then confirm.

            Needed only once; afterwards the app opens normally.

            **macOS 13/14:** right-click **Uncoded.app** → **Open** → **Open**.

            **Terminal alternative** (removes the quarantine flag): `xattr -d com.apple.quarantine /Applications/Uncoded.app`
